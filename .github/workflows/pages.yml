name: Deploy App Maker to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Build the studio
        env:
          # Project sites are served from /<repo>/; use an empty value for a
          # user site (user.github.io) or a custom domain.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: bunx next build

      - name: Add published app folders
        run: |
          if [ -d apps ]; then
            mkdir -p out/apps
            cp -R apps/. out/apps/
          fi
          touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
